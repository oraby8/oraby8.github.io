# External plugins
# See http://ixti.net/software/2013/01/28/using-jekyll-plugins-on-github-pages.html for making `jekyll archives` work.
plugins:
  - jekyll-archives # Sorry, not GitHub pages friendly!
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-paginate-v2

exclude:
  - "/vendor/"

# Site settings
title: Ahmed Samir Oraby
subtitle: "Senior NLP & ML Engineer | Arabic LLMs, Speech & Autonomous AI Agents"
email: ahmedsamiroraby8@gmail.com
name: Ahmed Samir Oraby
description: >
  Technical blog and portfolio of Ahmed Samir Oraby, specializing in LLM fine-tuning, Arabic NLP & TTS pipelines, RAG, and AI agent architectures.
# Base URL of site (i.e. /blog). It should always start with a slash,
# and never end with a slash. Set it to a blank value if hosting at the
# root of your server.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://oraby8.github.io" # the base hostname & protocol for your site
cover: "/assets/header_image.jpg"
logo: "/assets/logo.png"
avatar: "/assets/avatar.png"

# Build settings
markdown: kramdown
future: true
inter_post_navigation: false
highlightjs_theme: "monokai-sublime"

# Pagination Settings
paginate: 5
paginate_path: "/page:num/"
# https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
pagination:
  enabled: true
  per_page: 5
  permalink: "/page/:num/"
  sort_reverse: true

# Archive settings (see https://github.com/jekyll/jekyll-archives/)
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: 'archive'
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

# Category descriptions (for archive pages)
descriptions:
  - cat: llm
    desc: "Insights, fine-tuning techniques (SFT, LoRA, QLoRA, RLHF), and evaluation benchmarks for Large Language Models."

  - cat: speech
    desc: "Text-to-Speech (TTS), phoneme normalization, and acoustic modeling for Arabic and regional dialects."

  - cat: agents
    desc: "Autonomous AI agents, workflow automation, and production RAG architectures."

  - cat: nlp
    desc: "Arabic Natural Language Processing, keyphrase extraction, and cultural knowledge bases."

# Social icons and sharing options
social:
