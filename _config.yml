    icon: github
    username: oraby8
    url: https://github.com/oraby8
    desc: Follow me on GitHub
    share: false

  - name: LinkedIn
    icon: linkedin
    username: Ahmed Samir Oraby
    url: https://www.linkedin.com/in/ahmed-oraby-7b076881/
    desc: Connect with me on LinkedIn
    share: true

  - name: Twitter
    icon: twitter
    username: ""
    url: ""
