<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Where concept attribution hooks into a GLU MLP block</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f96"/>
    </marker>
  </defs>
  <rect width="760" height="270" fill="#fcfcfb"/>

  <rect x="16" y="98" width="96" height="50" rx="6" fill="#eef0f2" stroke="#cfd3d8"/>
  <text x="64" y="119" text-anchor="middle" font-size="13.5" fill="#111">hidden x</text>
  <text x="64" y="137" text-anchor="middle" font-size="12" fill="#666">[2048]</text>

  <rect x="150" y="38" width="134" height="50" rx="6" fill="#eef0f2" stroke="#cfd3d8"/>
  <text x="217" y="59" text-anchor="middle" font-size="13.5" fill="#111">gate_proj</text>
  <text x="217" y="77" text-anchor="middle" font-size="12" fill="#666">2048 → 8192</text>

  <rect x="150" y="158" width="134" height="50" rx="6" fill="#eef0f2" stroke="#cfd3d8"/>
  <text x="217" y="179" text-anchor="middle" font-size="13.5" fill="#111">up_proj</text>
  <text x="217" y="197" text-anchor="middle" font-size="12" fill="#666">2048 → 8192</text>

  <rect x="322" y="98" width="126" height="50" rx="6" fill="#eef0f2" stroke="#cfd3d8"/>
  <text x="385" y="119" text-anchor="middle" font-size="13.5" fill="#111">SiLU(g) ⊙ u</text>
  <text x="385" y="137" text-anchor="middle" font-size="12" fill="#666">elementwise</text>

  <rect x="486" y="98" width="112" height="50" rx="6" fill="#dce9f9" stroke="#2a7ad6" stroke-width="1.8"/>
  <text x="542" y="119" text-anchor="middle" font-size="13.5" fill="#111" font-weight="bold">X_d</text>
  <text x="542" y="137" text-anchor="middle" font-size="12" fill="#333">[8192 neurons]</text>

  <rect x="634" y="98" width="112" height="50" rx="6" fill="#eef0f2" stroke="#cfd3d8"/>
  <text x="690" y="119" text-anchor="middle" font-size="13.5" fill="#111">down_proj</text>
  <text x="690" y="137" text-anchor="middle" font-size="12" fill="#666">8192 → 2048</text>

  <path d="M112,116 L148,66" stroke="#8a8f96" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M112,130 L148,180" stroke="#8a8f96" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M284,66 L320,114" stroke="#8a8f96" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M284,180 L320,132" stroke="#8a8f96" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M448,123 L484,123" stroke="#8a8f96" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M598,123 L632,123" stroke="#8a8f96" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <path d="M542,148 L542,180" stroke="#2a7ad6" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="542" y="197" text-anchor="middle" font-size="13" fill="#1d5fae" font-weight="bold">forward-pre-hook</text>
  <text x="542" y="214" text-anchor="middle" font-size="12" fill="#555">capture · patch · read ‖X_d‖</text>

  <text x="380" y="252" text-anchor="middle" font-size="12.5" fill="#555">Pruning neuron i drops row i of gate_proj and up_proj, and column i of down_proj</text>
</svg>
