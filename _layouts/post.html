---
layout: default
---
<article class="post-view">
  <div class="back-nav">
    <a href="{{ '/' | prepend: site.baseurl }}" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <path d="M8.309 189.836L184.313 37.851C199.719 24.546 224 35.347 224 56.015v80.053c160.629 1.839 288 34.032 288 186.258 0 61.441-39.581 122.309-83.333 154.132-13.653 9.931-33.111-2.533-28.077-18.631 45.344-145.012-21.507-183.51-176.59-185.742V360c0 20.7-24.3 31.453-39.687 18.164l-176.004-152c-11.071-9.562-11.086-26.753 0-36.328z"/>
      </svg>
      <span>{{ site.title }}</span>
    </a>
  </div>

  <h1 class="post-title">{{ page.title }}</h1>

  <div class="post-date">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.categories.size > 0 %}
      <span> &middot; {{ page.categories | join: ", " | upcase }}</span>
    {% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
  <div class="post-tags" style="margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-family: var(--font-sans); font-size: 0.85rem; color: var(--meta-color);">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <span class="tag" style="background-color: var(--code-inline-bg); color: var(--text-color); padding: 0.2rem 0.5rem; border-radius: 4px; margin-left: 0.35rem; display: inline-block;">#{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}
</article>
